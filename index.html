<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; padding-bottom: env(safe-area-inset-bottom); }
        .typing::after { content: "▋"; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        textarea { height: 40px; }
        img { border-radius: 1rem; max-width: 100%; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body class="text-slate-100 flex flex-col h-screen font-sans overflow-hidden">

    <!-- Header: Только меню и модель -->
    <header class="p-3 bg-slate-900/80 border-b border-slate-800 flex items-center z-10">
        <button onclick="toggleSidebar()" class="p-2 text-slate-300">☰</button>
        <div onclick="toggleModelSelector()" id="currentModelBtn" class="flex-1 mx-3 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm flex justify-between items-center cursor-pointer">
            <span id="activeModelName" class="font-medium truncate text-xs">Загрузка моделей...</span>
        </div>
    </header>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-80 bg-slate-900 border-r border-slate-800 transform -translate-x-full transition-transform z-50 flex flex-col">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
            <h2 class="font-bold text-sm">Чаты</h2>
            <button onclick="toggleSidebar()" class="text-slate-400">✕</button>
        </div>
        <div id="historyTab" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </div>

    <!-- Model Selector (Scrollable) -->
    <div id="modelModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4" onclick="if(event.target === this) toggleModelSelector()">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-5 max-h-[80vh] flex flex-col">
            <h3 class="font-semibold text-sm pb-3 border-b border-slate-800 mb-3">Выберите модель</h3>
            <div id="modelListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </div>

    <!-- Chat Area -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <!-- Input Bar -->
    <div class="p-3 bg-slate-900/80 border-t border-slate-800">
        <div class="bg-slate-950 border border-slate-800 rounded-2xl flex items-end p-2">
            <textarea id="userInput" placeholder="Сообщение или 'Нарисуй...'" class="flex-1 bg-transparent px-3 py-2 text-sm outline-none resize-none max-h-32 text-slate-100"></textarea>
            <button onclick="handleUserSend()" class="bg-blue-600 px-4 py-2 rounded-xl text-sm font-medium ml-2">➤</button>
        </div>
    </div>

    <script>
        const OR_KEY = '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';
        const HF_KEY = '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';
        
        let models = [];
        let currentModel = localStorage.getItem('last_model') || '';
        let chats = JSON.parse(localStorage.getItem('omnia_chats')) || [{ id: 1, title: 'Новый чат', messages: [] }];
        let activeChatId = chats[0].id;

        window.onload = async () => {
            await fetchFreeModels();
            renderChats();
            loadActiveChat();
        };

        async function fetchFreeModels() {
            try {
                const res = await fetch('https://openrouter.ai/api/v1/models');
                const data = await res.json();
                models = data.data.filter(m => m.pricing.prompt === "0").slice(0, 30);
                if(!currentModel && models.length > 0) currentModel = models[0].id;
                renderModelSelector();
                updateActiveModelUI();
            } catch(e) { console.error(e); }
        }

        async function generateImage(prompt) {
            const bubble = appendMessageUI('assistant', 'Рисую...', true);
            try {
                const response = await fetch("https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${HF_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ inputs: prompt }),
                });
                
                if (!response.ok) throw new Error("API Error");
                
                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                
                bubble.innerText = '';
                const img = document.createElement('img');
                img.src = imageUrl;
                bubble.appendChild(img);
                bubble.classList.remove('typing');
            } catch(e) { 
                bubble.innerText = 'Ошибка: не удалось нарисовать картинку (сервер перегружен).'; 
            }
        }

        async function handleUserSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;
            input.value = '';
            appendMessageUI('user', text);
            if(text.toLowerCase().includes('нарисуй')) await generateImage(text);
            else await sendTextMessage(text);
        }

        async function sendTextMessage(text) {
            const chat = chats.find(x => x.id === activeChatId);
            chat.messages.push({ role: 'user', content: text });
            const bubble = appendMessageUI('assistant', '', true);

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${OR_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: currentModel, messages: chat.messages, stream: true })
                });

                if(!response.ok) throw new Error();

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while(true) {
                    const { done, value } = await reader.read();
                    if(done) break;
                    const lines = decoder.decode(value).split('\n');
                    for(const line of lines) {
                        if(line.startsWith('data: ')) {
                            const jsonStr = line.slice(6).trim();
                            if(jsonStr === '[DONE]') break;
                            try {
                                const json = JSON.parse(jsonStr);
                                const content = json.choices[0].delta.content || '';
                                fullContent += content;
                                bubble.innerText = fullContent;
                            } catch(e) {}
                        }
                    }
                }
                bubble.classList.remove('typing');
                chat.messages.push({ role: 'assistant', content: fullContent });
                saveData();
            } catch(e) { bubble.innerText = 'Ошибка: сервер ответил 500 или недоступен.'; }
        }

        // --- Utils ---
        function appendMessageUI(role, text, isTyping = false) {
            const container = document.getElementById('chatContainer');
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] px-4 py-2.5 rounded-2xl text-sm ${role === 'user' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-slate-800 text-slate-200 rounded-bl-sm'} ${isTyping ? 'typing' : ''}`;
            bubble.innerText = text;
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
            return bubble;
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function toggleModelSelector() { document.getElementById('modelModal').classList.toggle('hidden'); }
        function saveData() { localStorage.setItem('omnia_chats', JSON.stringify(chats)); }
        function updateActiveModelUI() { document.getElementById('activeModelName').innerText = currentModel.split('/').pop(); localStorage.setItem('last_model', currentModel); }
        function renderModelSelector() {
            const cont = document.getElementById('modelListContainer');
            cont.innerHTML = '';
            models.forEach(m => {
                const d = document.createElement('div');
                d.className = `p-3 rounded-xl border cursor-pointer ${currentModel === m.id ? 'bg-slate-800 border-blue-500' : 'bg-slate-950 border-slate-800 hover:border-slate-700'}`;
                d.innerText = m.name || m.id;
                d.onclick = () => { currentModel = m.id; updateActiveModelUI(); toggleModelSelector(); };
                cont.appendChild(d);
            });
        }
        function renderChats() {
            const cont = document.getElementById('historyTab');
            cont.innerHTML = '';
            chats.forEach(c => {
                const d = document.createElement('div');
                d.className = `p-2.5 rounded-xl cursor-pointer ${c.id === activeChatId ? 'bg-slate-800' : ''}`;
                d.innerText = c.title || 'Новый чат';
                d.onclick = () => { activeChatId = c.id; loadActiveChat(); toggleSidebar(); };
                cont.appendChild(d);
            });
        }
        function loadActiveChat() {
            const chat = chats.find(x => x.id === activeChatId);
            document.getElementById('chatContainer').innerHTML = '';
            chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
        }
    </script>
</body>
</html>
